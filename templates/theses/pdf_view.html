{% extends 'base.html' %}
{% block title %}PDF Viewer | {{ thesis.title }}{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="glass rounded-3xl p-6 flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
        <div>
            <p class="text-sm uppercase tracking-[0.28em] text-cyan-200/70">PDF viewer</p>
            <h1 class="mt-2 text-3xl font-bold text-white">{{ thesis.title }}</h1>
            <p class="mt-2 text-sm text-slate-400">{{ thesis.course.name }} | {{ thesis.year|default:"Unknown year" }}</p>
        </div>
        <div class="flex flex-wrap gap-3">
            <a href="{% url 'thesis-detail' thesis.pk %}" class="rounded-full border border-cyan-400/30 px-5 py-2.5 text-cyan-100 hover:bg-cyan-400/10">Back to thesis</a>
            <a href="{{ thesis.pdf_file.url }}" target="_blank" class="rounded-full bg-cyan-400 px-5 py-2.5 font-semibold text-slate-950 hover:bg-cyan-300">Open in new tab</a>
            <a href="{% url 'thesis-download' thesis.pk %}" class="js-download-confirm rounded-full border border-cyan-400/30 px-5 py-2.5 text-cyan-100 hover:bg-cyan-400/10">Download</a>
        </div>
    </div>

    <div class="glass rounded-3xl p-4 overflow-hidden">
        <object data="{{ thesis.pdf_file.url }}" type="application/pdf" class="h-[82vh] w-full rounded-2xl bg-white">
            <div class="flex h-[82vh] items-center justify-center p-8 text-center text-slate-200">
                <div>
                    <p class="text-lg font-semibold">Your browser cannot display this PDF inline.</p>
                    <p class="mt-2 text-sm text-slate-400">Use the open or download button above.</p>
                </div>
            </div>
        </object>
    </div>
</div>
{% endblock %}
